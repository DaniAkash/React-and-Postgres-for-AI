# Three services, one Postgres database. PostgREST and pg_graphql are
# the auto-generated APIs the slides talk about. Both read the same
# schema and respect the same RLS policies the Next.js app does.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repo
      POSTGRES_PASSWORD: repo
      POSTGRES_DB: repo
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  # REST API auto-derived from the schema.
  # Every endpoint respects RLS via the JWT claim that sets app.team_id.
  postgrest:
    image: postgrest/postgrest:v12.2.0
    depends_on: [postgres]
    environment:
      PGRST_DB_URI: postgres://repo:repo@postgres:5432/repo
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: repo
      PGRST_JWT_SECRET: dev-secret-please-rotate
    ports:
      - "3001:3000"

  # GraphQL API derived from the same schema. Add to a connection string:
  #   postgres://... + ?options=-csearch_path=public,graphql
  # Then query at http://localhost:3002/graphiql.
  pggraphql:
    image: supabase/pg_graphql:latest
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgres://repo:repo@postgres:5432/repo
    ports:
      - "3002:5000"

volumes:
  pgdata:
